<!doctype html>
<html lang="en">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>Explain the Model</title>
  <style>
    :root { --bg: #ffffff; --fg: #1d1d1f; --muted: #6b6b70; --line: #d9d9de; --accent: #2f6fde; --up: #c2410c; --down: #1d6fb8; --card: #f6f6f8; }
    @media (prefers-color-scheme: dark) {
      :root { --bg: #151517; --fg: #ececef; --muted: #a0a0a8; --line: #36363c; --accent: #7aa7ff; --up: #fb923c; --down: #60a5fa; --card: #1f1f23; }
    }
    * { box-sizing: border-box; }
    body { margin: 0; background: var(--bg); color: var(--fg); font: 16px/1.5 system-ui, sans-serif; }
    header, main { max-width: 1050px; margin: 0 auto; padding: 16px; }
    nav a { margin-right: 16px; color: var(--accent); text-decoration: none; }
    nav a.active { font-weight: 700; text-decoration: underline; }
    .controls { display: flex; flex-wrap: wrap; gap: 12px; margin: 12px 0; }
    select, input { font: inherit; padding: 4px 6px; background: var(--card); color: var(--fg); border: 1px solid var(--line); border-radius: 6px; }
    table { border-collapse: collapse; width: 100%; margin: 12px 0; }
    td, th { border-bottom: 1px solid var(--line); padding: 4px 8px; text-align: left; }
    td.num { text-align: right; font-variant-numeric: tabular-nums; }
    .up { color: var(--up); } .down { color: var(--down); }
    .note { color: var(--muted); font-size: 14px; }
    .starter { background: var(--card); border: 1px dashed var(--line); padding: 8px 12px; border-radius: 8px; }
    .inputs { display: grid; grid-template-columns: repeat(auto-fill, minmax(200px, 1fr)); gap: 8px; }
    .inputs label { display: flex; flex-direction: column; font-size: 14px; }
    svg { width: 100%; height: auto; }
    h1 { font-size: clamp(2rem,5vw,3.5rem); letter-spacing: -.04em; margin-bottom: 12px; }
    h2 { letter-spacing: -.025em; }
    nav { display:flex; flex-wrap:wrap; gap:10px; }
    nav a { padding: 8px 12px; border-radius: 8px; background:var(--card); margin:0; }
    .lesson { border-left:4px solid var(--accent); background:var(--card); padding:16px 20px; border-radius:8px; margin:18px 0; }
    .lesson p { margin:5px 0 0; }
    .hero { display:grid; grid-template-columns:repeat(auto-fit,minmax(210px,1fr)); gap:12px; margin:18px 0; }
    .hero span { display:flex; flex-direction:column; background:var(--card); padding:16px; border-radius:12px; }
    .hero b { font-size:1.7rem; }
    .bars { display:grid; gap:10px; margin:18px 0 26px; }
    .barrow { display:grid; grid-template-columns:minmax(140px,1.2fr) minmax(100px,2fr) minmax(90px,1fr); align-items:center; gap:12px; font-size:14px; }
    .barrow b { text-align:right; font-variant-numeric:tabular-nums; }
    .track { height:17px; background:var(--card); border-radius:6px; overflow:hidden; }
    .bar { height:100%; border-radius:6px; }
    .positive { background:var(--up); } .negative { background:var(--down); }
    input[type=range] { width:min(500px,75vw); accent-color:var(--accent); }
    @media(max-width:600px){ .barrow { grid-template-columns:1fr 1.2fr 85px; gap:6px; font-size:12px; } }
  </style>
</head>
<body>
  <header>
    <h1>Explain the Model</h1>
    <nav>
      <a href="#linear">Push &amp; Pull</a>
      <a href="#forest">Wisdom of the Forest</a>
      <a href="#boosting">One Correction at a Time</a>
    </nav>
    <div class="controls">
      <label>Dataset <select id="dataset"></select></label>
      <label>Example person <select id="person"></select></label>
    </div>
  </header>
  <main id="section"></main>
  <script type="module" src="app.js"></script>
</body>
</html>
